<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Vault Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #171717;
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 15px auto;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .chat {
            width: 95%;
            max-width: 700px;
            height: 70vh;
            min-height: 400px;
            margin: 20px auto;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            background: #252525;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .username {
            font-weight: bold;
            color: #aaa;
        }

        .system {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        #status {
            padding: 8px;
            text-align: center;
            font-size: 13px;
            color: #777;
            border-top: 1px solid #292929;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid #333;
        }

        input {
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            outline: none;
        }

        #username {
            width: 28%;
        }

        #message {
            flex: 1;
        }

        button {
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
        }

        button:active {
            background: #444;
        }

        @media (max-width: 500px) {
            .input-area {
                flex-wrap: wrap;
            }

            #username {
                width: 100%;
            }

            #message {
                width: 70%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>💬 Pixel Vault Chat</h1>
</header>

<a class="back" href="index.html">
    ← Back to Games
</a>

<div class="chat">

    <div id="messages">
        <div class="system">
            Loading chat...
        </div>
    </div>

    <div id="status">
        Connecting...
    </div>

    <div class="input-area">

        <input
            id="username"
            type="text"
            maxlength="20"
            placeholder="Username"
        >

        <input
            id="message"
            type="text"
            maxlength="200"
            placeholder="Type a message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://gjpjcvxxsrbpquesfrbp.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable__419UIyCwOG8YovoN5mNww_BBkwkQrh";


    const messagesBox =
        document.getElementById("messages");

    const statusBox =
        document.getElementById("status");


    let supabaseClient;


    function showSystemMessage(text) {

        messagesBox.innerHTML = "";

        const message =
            document.createElement("div");

        message.className = "system";

        message.textContent = text;

        messagesBox.appendChild(message);
    }


    function addMessage(data) {

        const message =
            document.createElement("div");

        message.className = "message";


        const username =
            document.createElement("span");

        username.className = "username";

        username.textContent =
            data.username + ": ";


        const text =
            document.createElement("span");

        text.textContent =
            data.message;


        message.appendChild(username);

        message.appendChild(text);

        messagesBox.appendChild(message);

        messagesBox.scrollTop =
            messagesBox.scrollHeight;
    }


    async function loadMessages() {

        try {

            const result =
                await supabaseClient
                    .from("pixelvault")
                    .select("*")
                    .order("created_at", {
                        ascending: true
                    });


            if (result.error) {

                console.error(result.error);

                showSystemMessage(
                    "Chat database error: " +
                    result.error.message
                );

                statusBox.textContent =
                    "Database connection failed.";

                return;
            }


            messagesBox.innerHTML = "";


            if (!result.data ||
                result.data.length === 0) {

                showSystemMessage(
                    "No messages yet. Be the first!"
                );

            } else {

                result.data.forEach(addMessage);

            }


            statusBox.textContent =
                "Connected";

        } catch (error) {

            console.error(error);

            showSystemMessage(
                "Could not connect to chat."
            );

            statusBox.textContent =
                "Connection error.";
        }
    }


    async function sendMessage() {

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const message =
            document
                .getElementById("message")
                .value
                .trim();


        if (!username) {

            statusBox.textContent =
                "Enter a username first.";

            return;
        }


        if (!message) {

            return;
        }


        statusBox.textContent =
            "Sending...";


        try {

            const result =
                await supabaseClient
                    .from("pixelvault")
                    .insert({
                        username: username,
                        message: message
                    });


            if (result.error) {

                console.error(result.error);

                statusBox.textContent =
                    "Send failed: " +
                    result.error.message;

                return;
            }


            document
                .getElementById("message")
                .value = "";


            statusBox.textContent =
                "Connected";


        } catch (error) {

            console.error(error);

            statusBox.textContent =
                "Something went wrong.";
        }
    }


    function startChat() {

        try {

            if (!window.supabase) {

                showSystemMessage(
                    "Supabase library did not load."
                );

                statusBox.textContent =
                    "Connection error.";

                return;
            }


            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );


            loadMessages();


            supabaseClient
                .channel("pixelvault-chat")
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "pixelvault"
                    },
                    function(payload) {

                        addMessage(payload.new);

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "Realtime:",
                            status
                        );

                    }
                );


        } catch (error) {

            console.error(error);

            showSystemMessage(
                "Chat failed to start: " +
                error.message
            );

            statusBox.textContent =
                "Error.";
        }
    }


    document
        .getElementById("message")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );


    startChat();

</script>

</body>
</html>
