<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Vault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: white;
        }

        header {
            background: #171717;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 8px 0 18px;
            color: #999;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-button {
            display: inline-block;
            padding: 12px 20px;
            background: #252525;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid #444;
            font-weight: bold;
        }

        .top-button:active {
            background: #333;
        }

        .search-area {
            padding: 20px;
            text-align: center;
        }

        #searchBar {
            width: 90%;
            max-width: 650px;
            padding: 15px;
            background: #191919;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px;
            overflow-x: auto;
        }

        .category {
            background: #191919;
            border: 1px solid #333;
            color: white;
            padding: 10px 17px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        .category:active {
            background: #333;
        }

        main {
            padding: 10px 20px 30px;
        }

        .section-title {
            margin-bottom: 18px;
        }

        .section-title h2 {
            margin: 0;
        }

        .section-title p {
            color: #777;
            margin-top: 5px;
        }

        .games {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }

        .game {
            background: #181818;
            border: 1px solid #303030;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .game:active {
            transform: scale(0.97);
        }

        .game-image {
            height: 125px;
            background: #252525;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
        }

        .game-info {
            padding: 13px;
        }

        .game-info h3 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        .game-info p {
            margin: 0;
            color: #888;
            font-size: 14px;
        }

        .no-results {
            display: none;
            text-align: center;
            color: #777;
            padding: 40px 10px;
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

<header>

    <h1>🎮 Pixel Vault</h1>

    <p>Your game hub</p>

    <div class="top-buttons">

        <a class="top-button" href="chat.html">
            💬 Chat
        </a>

    </div>

</header>


<div class="search-area">

    <input
        id="searchBar"
        type="text"
        placeholder="🔎 Search games..."
        oninput="searchGames()"
    >

</div>


<div class="categories">

    <button
        class="category"
        onclick="filterGames('all')">
        All
    </button>

    <button
        class="category"
        onclick="filterGames('action')">
        Action
    </button>

    <button
        class="category"
        onclick="filterGames('arcade')">
        Arcade
    </button>

    <button
        class="category"
        onclick="filterGames('racing')">
        Racing
    </button>

    <button
        class="category"
        onclick="filterGames('puzzle')">
        Puzzle
    </button>

</div>


<main>

    <div class="section-title">

        <h2>Games</h2>

        <p>Choose a game to play</p>

    </div>


    <div class="games">


        <div
            class="game"
            data-category="action"
            data-name="Example Action Game"
            onclick="openGame('example')">

            <div class="game-image">
                ⚔️
            </div>

            <div class="game-info">

                <h3>Example Action Game</h3>

                <p>Action</p>

            </div>

        </div>


        <div
            class="game"
            data-category="arcade"
            data-name="Example Arcade Game"
            onclick="openGame('example')">

            <div class="game-image">
                👾
            </div>

            <div class="game-info">

                <h3>Example Arcade Game</h3>

                <p>Arcade</p>

            </div>

        </div>


        <div
            class="game"
            data-category="racing"
            data-name="Example Racing Game"
            onclick="openGame('example')">

            <div class="game-image">
                🏎️
            </div>

            <div class="game-info">

                <h3>Example Racing Game</h3>

                <p>Racing</p>

            </div>

        </div>


        <div
            class="game"
            data-category="puzzle"
            data-name="Example Puzzle Game"
            onclick="openGame('example')">

            <div class="game-image">
                🧩
            </div>

            <div class="game-info">

                <h3>Example Puzzle Game</h3>

                <p>Puzzle</p>

            </div>

        </div>


    </div>


    <div
        id="noResults"
        class="no-results">

        No games found.

    </div>

</main>


<footer>

    Pixel Vault © 2026

</footer>


<script>

    function searchGames() {

        const search =
            document
                .getElementById("searchBar")
                .value
                .toLowerCase();

        const games =
            document.querySelectorAll(".game");

        let found = 0;

        games.forEach(game => {

            const name =
                game.dataset.name.toLowerCase();

            if (name.includes(search)) {

                game.style.display = "block";
                found++;

            } else {

                game.style.display = "none";

            }

        });

        document.getElementById("noResults")
            .style.display =
            found === 0 ? "block" : "none";
    }


    function filterGames(category) {

        const games =
            document.querySelectorAll(".game");

        let found = 0;

        games.forEach(game => {

            if (
                category === "all" ||
                game.dataset.category === category
            ) {

                game.style.display = "block";
                found++;

            } else {

                game.style.display = "none";

            }

        });

        document.getElementById("noResults")
            .style.display =
            found === 0 ? "block" : "none";

    }


    function openGame(game) {

        window.location.href =
            "game.html?game=" + game;

    }

</script>

</body>
</html>
