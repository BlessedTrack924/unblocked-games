<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Vault</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            background: #181818;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
        }

        .back {
            display: inline-block;
            margin: 20px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .game-container {
            width: 95%;
            max-width: 1000px;
            height: 600px;
            margin: auto;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Pixel Vault</h1>
</header>

<a class="back" href="index.html">← Back to Games</a>

<div class="game-container">
    <iframe
        id="gameFrame"
        allowfullscreen>
    </iframe>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const game = params.get("game");

    const games = {
        example: "https://example.com"
    };

    if (games[game]) {
        document.getElementById("gameFrame").src = games[game];
    }
</script>

</body>
</html>
