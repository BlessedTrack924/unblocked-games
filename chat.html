<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Vault Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #181818;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 15px auto;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .chat {
            width: 95%;
            max-width: 700px;
            height: 70vh;
            margin: 20px auto;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            background: #242424;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            word-wrap: break-word;
        }

        .username {
            font-weight: bold;
            color: #aaa;
        }

        .input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #333;
        }

        input {
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            outline: none;
        }

        #username {
            width: 30%;
        }

        #message {
            flex: 1;
        }

        button {
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
        }

        button:active {
            background: #444;
        }

        #status {
            text-align: center;
            color: #777;
            font-size: 13px;
            padding-bottom: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>💬 Pixel Vault Chat</h1>
</header>

<a class="back" href="index.html">← Back to Games</a>

<div class="chat">

    <div id="messages"></div>

    <div id="status">Connecting...</div>

    <div class="input-area">

        <input
            id="username"
            type="text"
            placeholder="Username"
            maxlength="20"
        >

        <input
            id="message"
            type="text"
            placeholder="Message..."
            maxlength="200"
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>

<script>
    const SUPABASE_URL = "https://gjpjcvxxsrbpquesfrbp.supabase.co";

    const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const messagesBox = document.getElementById("messages");
    const statusBox = document.getElementById("status");

    async function loadMessages() {

        const { data, error } = await supabaseClient
            .from("pixelvault")
            .select("*")
            .order("created_at", { ascending: true });

        if (error) {
            console.error(error);
            statusBox.textContent = "Could not load messages.";
            return;
        }

        messagesBox.innerHTML = "";

        data.forEach(addMessage);

        messagesBox.scrollTop = messagesBox.scrollHeight;

        statusBox.textContent = "Connected";
    }

    function addMessage(message) {

        const div = document.createElement("div");

        div.className = "message";

        const username = document.createElement("span");
        username.className = "username";
        username.textContent = message.username + ": ";

        const text = document.createElement("span");
        text.textContent = message.message;

        div.appendChild(username);
        div.appendChild(text);

        messagesBox.appendChild(div);

        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function sendMessage() {

        const username =
            document.getElementById("username").value.trim();

        const message =
            document.getElementById("message").value.trim();

        if (!username || !message) {
            return;
        }

        const { error } = await supabaseClient
            .from("pixelvault")
            .insert({
                username: username,
                message: message
            });

        if (error) {
            console.error(error);
            statusBox.textContent = "Message failed to send.";
            return;
        }

        document.getElementById("message").value = "";
    }

    supabaseClient
        .channel("pixelvault-chat")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "pixelvault"
            },
            payload => {
                addMessage(payload.new);
            }
        )
        .subscribe();

    document
        .getElementById("message")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

    loadMessages();
</script>

</body>
</html>
