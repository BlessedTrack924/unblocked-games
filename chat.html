<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Vault Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #181818;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 15px auto;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .chat {
            width: 95%;
            max-width: 700px;
            height: 70vh;
            margin: 20px auto;
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            background: #242424;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .username {
            font-weight: bold;
            color: #aaa;
        }

        .input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #333;
        }

        #username,
        #message {
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            outline: none;
        }

        #username {
            width: 30%;
        }

        #message {
            flex: 1;
        }

        button {
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
        }

        button:active {
            background: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>💬 Pixel Vault Chat</h1>
</header>

<a class="back" href="index.html">← Back to Games</a>

<div class="chat">

    <div id="messages">
        <div class="message">
            <span class="username">System:</span>
            Welcome to Pixel Vault Chat!
        </div>
    </div>

    <div class="input-area">

        <input
            id="username"
            type="text"
            placeholder="Username"
            maxlength="20"
        >

        <input
            id="message"
            type="text"
            placeholder="Message..."
            maxlength="200"
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>

<script>
    function sendMessage() {

        const username =
            document.getElementById("username").value.trim();

        const message =
            document.getElementById("message").value.trim();

        if (!username || !message) {
            return;
        }

        const messages =
            document.getElementById("messages");

        const newMessage =
            document.createElement("div");

        newMessage.className = "message";

        newMessage.innerHTML =
            "<span class='username'>" +
            escapeHTML(username) +
            ":</span> " +
            escapeHTML(message);

        messages.appendChild(newMessage);

        messages.scrollTop = messages.scrollHeight;

        document.getElementById("message").value = "";
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    document.getElementById("message")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });
</script>

</body>
</html>
